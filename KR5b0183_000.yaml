body:
  text: 玄靈轉經早朝行道儀玄靈轉經午朝行道儀玄靈轉經晚朝行道儀玄靈轉經早朝行道儀法事如式各禮師存念如法請宣神呪九天上景化生華暉晃漾太空曜真紫微上致中皇百神降回散根離苦八難豁開七祖同升福慶巍巍使我神仙八景齊飛鳴法鼓二十四通無上三天玄元始三氣太上老君名出臣身中三五功曹左右官使者左右捧香驛龍騎吏侍香金童傳言散花玉女五帝直符直日香官各三十六人出出者嚴裝顯服冠帶垂纓關啓玄壇土地方域神真臣今早朝升壇行道朝謁神真欽奉其諸丹悃具奏緘謄願得太上至真道氣靈寶瑞光下降流入臣等身中令臣所啓之誠速逹徑御至真無極大道三清上聖中天星主紫微大帝北斗九皇星君御前請稱法位具位臣姓某與臨壇官衆等謹同誠上啓太上無極大道斗極祖師元始天尊斗極玄師靈寶天尊斗極宗師道德天尊昊天玉皇上帝北極紫微大帝紫微天皇大帝斗中高上玉皇尊星君大微玉帝北極玄卿大帝君北斗天英貪狼大星君北斗天任巨門元星君北斗天樞祿存真星君北斗天心文曲紐星君北斗天禽廉貞綱星君北斗天輔武曲紀星君北斗天衝破軍關星君北斗洞明左輔星君北斗隱光右弼星君九皇夫人九隂內妃天罡大聖萬真節度奎光帝君北斗中三台華蓋星君當生本命星君南極老人壽德星君上清福德星君上清祿德星君帝座照臨星宰二十八宿星君六十甲子星君道德玄曹官君聖衆玄中大法師真君三天大法師真君中天九省諸相丈人左右繡永使者擎羊陀羅使者四直玉文功曹通事含人斗中千乘萬騎一切真靈恭望洪慈俯回洞鑒臣聞三景開明九星胤彩地祇擁玉局之座道運昭敷天師侍金闕之尊經文煥耀作舟船而津梁男女司喉舌而統御仙靈凡居堪輿之中孰出陶鎔之外臣等宿緣儲慶真籍登名參河圖豁落之文佩三五璇璣之籙勉思功行庸贊生成以今欽奉聖旨崇修金籙臣等恪遵經訣夙建靈壇象地法天望紫宸而稽首延生益算注舟簡以傾心願施雨露之恩冀順隂陽之序以今早朝升壇行道請法衆等運兹𥘉捻上香願此香煙騰空徑上供養至真無上道寶大羅元始天尊紫微上宮天皇大帝玉斗二帝九皇星君清微天宮真仙聖衆臣等皈身皈神皈命首體投地仰依太上三尊十方衆聖願以是香功德上祝皇帝陛下伏願乾坤呈彩河洛輝符赤鴈白麟千古紀瑶圖之瑞金枝玉葉萬年開寶曆之祥聖壽天齊皇明日麗今故燒香自皈依師尊大聖衆至真之德得道之後保天長存和與道合真以今早朝升壇行道請法衆等運兹二捻上香願此香煙騰空徑上供養至真無上經寶玉宸道君靈寶天尊紫微中宮北極大帝當生本命元辰星君帝座照臨星宰禹餘天宫真仙聖衆臣等皈身皈神皈命首體投地仰依太上三尊十方衆聖願以是香功德敬祝皇太子殿下伏願真風披拂慧日舒明碧漢流祥壽域天開於箕翼紫樞衍慶福源雲集於芝蘭今故燒香自皈依師尊大聖衆至真之德得道之後保天長存和與道合真以今早朝升壇行道請法衆等運兹三捻上香願此香煙騰空徑上供養至真無上師寶五靈玄老道德天尊南極老人壽德星君上清福德星君上清祿德星君太赤天宮真仙聖衆臣等皈身昄神皈命首體投地仰依太上三尊十方衆聖願以是香功德皈流臣等三師四友同學門人伏願性天澄湛心地虛明定籙金華八萬四千之塵勞淨盡摽名玉簡一千二百之戒行周圎今故燒香自皈依師尊大聖衆至真之德得道之後永保長存和與道合真七元覆護天尊啓經臣聞本命經訣無上法橋實三洞之真宗為羣生之正路故開轉者得生人中而聰明殊勝令持誦者永為身寶而福壽可稱臣自愧凡微欣逢化育菏七星之降氣感二極之垂精持人命以保天年既悉由於主宰設醮筵而修香火敢自蹈於輕迷欽奉綸音崇修金籙三時行道依祕典以宣揚九遍轉經按洞章而肅詠玄壇闡事紫極布恩期密仗於一乘可增延於萬壽伏願玄靈焕彩斗極流輝監兹一瓣之香恪賜九光之燭冀一人之有慶四海永清感萬聖之護持千真敬仰逹生榮界出八福鄉稽首皈依人各恭敬三皈依經心開悟解受持讀誦志心皈依十方道寶當願衆生起心回向一切信禮師普上法橋無有障礙宿命贊宿命有信然弱喪謂之無皆欲眼前見過目即言悠大賢明道教慘戚憫頑夫依依念子苦勤勤令我憂臣等謹按經云北辰在上而衆星拱之為造化之樞機作人神之主宰有消災度厄之力有延齡益算之功上至帝王下及庶人尊卑雖則殊途命分俱無差别以今欽奉綸音崇修金籙祝壽延禧臣等謹率在壇清衆轉誦太上玄靈北斗本命延生真經各一過上祝中天大聖第一太尉府天英貪狼玉晨君乞為削落南離九紫鶉火分野一切之厄仰希矜軫俯賜允俞臣不勝激切之至修行經法敷座贊題經誦經畢解座贊臣等向來祗率清衆升壇行道上祝聖壽萬安轉誦太上玄靈北斗本命延生真經各一過並巳周圓恭琞福壽資命善果臻身人各運誠旋行讃詠步虛引至南方上香旋行復位玄靈感應天尊臣等謹按經云本命之日修齋設醮啓祝北斗三官五帝九府四司薦福消災奏章懇願功德深重不可具陳以今欽奉綸音崇修金籙祝壽延禧臣等謹率在壇清衆轉誦太上玄靈北斗本命延生真經各一過上祝中天大聖第二上宰府天任巨門玉晨君乞為削落東北艮位八白析木星紀分野一切之厄仰希矜軫俯賜允俞臣等不勝激切之至修行經法敷座贊題經誦經畢解座贊臣等向來祗率清衆升壇行道上祝聖壽萬安轉誦太上玄靈北斗本命延生真經各一過並巳周圎恭望福壽資命善果臻身人各運誠旋行讃詠步虛引至東北方上香旋行復位大慈延壽天尊臣等謹按經云若有危厄如何救解急須投告北斗醮謝真君及轉真經認本命真君方獲安泰以致康榮以今欽奉綸音崇修金籙祝壽延禧臣等謹率在壇清衆轉誦太上玄靈北斗本命延生真經各一過上祝中天大聖第三司空府天柱祿存玉晨君乞為削落西兊大梁分野一切之厄仰希矜軫俯賜允俞臣等不勝激切之至修行經法敷座贊題經誦經畢解座贊臣等向來祗率清衆升壇行道上祝聖壽萬安轉誦太上玄靈北斗本命延生真經各一過並巳周圎恭望福壽資命善果臻身人各運誠旋行讃詠步虛引至西方上香旋行復位三聞經天長地久海晏河清聞經巳後當願聖壽萬安皇圖鞏固金枝蕃衍寶曆綿洪發願存神燒香香官使者左右龍虎君侍香諸靈官當令臣向來早朝轉經行道之所自然生金液丹碧芝英百靈衆真交會在此香火爐前當願丹誠感格洪貺潛敷聖壽萬安皇圖永久十方仙童玉女接侍蘭煙傳臣向來所奏之誠速逹徑御至真無極大道三清上聖紫微北極大帝北斗九皇星君御前出堂頌玄靈轉經早朝行道儀
